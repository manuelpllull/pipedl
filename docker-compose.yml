services:
  pipedl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pipedl
    restart: unless-stopped

    environment:
      # ── Spotify target ──────────────────────────────────────────────────
      TARGET_USER_ID: mnupea          # Spotify user ID to sync

      # ── Scheduling ──────────────────────────────────────────────────────
      # Quartz cron: default = daily at midnight. Override as needed.
      CRON_EXPRESSION: "0 0 0 * * ?"

      # ── Paths (match volume mount points below) ──────────────────────────
      DB_PATH: /data/pipedl.db
      MUSIC_OUTPUT_PATH: /music

      # ── Run mode ─────────────────────────────────────────────────────────
      # Set to "1" to scrape once and exit instead of running the scheduler.
      # RUN_ONCE: "1"

      # ── Navidrome (optional) ──────────────────────────────────────────────
      # NAVIDROME_URL: http://navidrome:4533
      # NAVIDROME_USER: admin
      # NAVIDROME_PASSWORD: secret

    volumes:
      - pipedl-data:/data      # SQLite database
      - pipedl-music:/music    # Downloaded music files

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    ports:
      - "4533:4533"
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
    volumes:
      - navidrome-data:/data
      - pipedl-music:/music:ro   # Read-only access to the downloaded music
    restart: unless-stopped

# ─── Named volumes ────────────────────────────────────────────────────────────
volumes:
  pipedl-data:
  pipedl-music:
  navidrome-data:

# ─── Optional shared network with Navidrome ──────────────────────────────────
# networks:
#   media:
#     external: true
